<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — HB Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --bg-alt: #1A1A1A;
    --placeholder: #2A2A2A;
    --accent: #F5A800;
    --text: #FFFFFF;
    --text-secondary: #AAAAAA;
    --error: #E23B3B;
    --font-display: 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-accent: 'Playfair Display', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  .accent {
    font-family: var(--font-accent);
    font-style: italic;
    font-weight: 600;
    color: var(--accent);
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
  }

  /* ---------- Logo ---------- */
  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-logo img {
    height: 64px;
    margin: 0 auto;
  }
  .login-logo .logo-text {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: -1px;
  }

  /* ---------- Card ---------- */
  .login-card {
    background: var(--bg-alt);
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 36px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .login-card h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 24px;
    text-align: center;
  }

  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 7px;
    letter-spacing: 0.3px;
  }
  .field input {
    width: 100%;
    background: #0F0F0F;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 13px 15px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,168,0,0.15);
  }
  .field input::placeholder { color: #555; }

  /* ---------- Button ---------- */
  .btn-submit {
    width: 100%;
    display: inline-block;
    font-family: var(--font-display);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 1.02rem;
    padding: 14px 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #0A0A0A;
    transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    margin-top: 6px;
  }
  .btn-submit:hover:not(:disabled) {
    box-shadow: 0 0 22px rgba(245,168,0,0.45);
    transform: translateY(-2px);
  }
  .btn-submit:disabled {
    opacity: 0.6;
    cursor: default;
  }

  /* ---------- Error ---------- */
  .error-msg {
    display: none;
    background: rgba(226,59,59,0.1);
    border: 1px solid rgba(226,59,59,0.4);
    color: #ff7b7b;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 11px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
  }
  .error-msg.show { display: block; }

  /* ---------- Forgot link ---------- */
  .forgot {
    text-align: center;
    margin-top: 20px;
  }
  .forgot a {
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color .18s ease;
  }
  .forgot a:hover { color: var(--accent); }

  @media (max-width: 420px) {
    .login-card { padding: 30px 22px; }
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <img src="../logo.png" alt="HB Performance"
           onerror="this.style.display='none';document.getElementById('logoText').style.display='block';">
      <div id="logoText" class="logo-text" style="display:none;">HB <span class="accent">Performance</span></div>
    </div>

    <div class="login-card">
      <h1>Accedé a tu <span class="accent">portal</span></h1>

      <div id="errorMsg" class="error-msg"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Ingresar</button>
      </form>

      <div class="forgot">
        <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
    function clearError() {
      errorMsg.textContent = '';
      errorMsg.classList.remove('show');
    }

    // Redirige según el rol del perfil
    async function redirectByRole(userId) {
      const { data: profile, error } = await sb
        .from('profiles')
        .select('role')
        .eq('id', userId)
        .single();

      if (error || !profile) {
        showError('No se pudo cargar tu perfil. Contactá a tu coach.');
        return;
      }

      if (profile.role === 'admin') {
        window.location.href = '../admin/index.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    // Al cargar: si ya hay sesión activa, redirigir automáticamente
    (async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        await redirectByRole(session.user.id);
      }
    })();

    // Submit del formulario de login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Completá email y contraseña.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando…';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Email o contraseña incorrectos.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
        return;
      }

      await redirectByRole(data.user.id);
    });

    // Placeholder recuperar contraseña
    document.getElementById('forgotLink').addEventListener('click', async (e) => {
      e.preventDefault();
      clearError();
      const email = emailInput.value.trim();
      if (!email) {
        showError('Escribí tu email arriba y volvé a tocar el enlace.');
        return;
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://hbperformance.fit/app/set-password.html'
      });
      if (error) {
        showError('No se pudo enviar el email de recuperación.');
      } else {
        errorMsg.style.color = '';
        errorMsg.textContent = 'Te enviamos un email para restablecer tu contraseña.';
        errorMsg.classList.add('show');
        errorMsg.style.background = 'rgba(245,168,0,0.1)';
        errorMsg.style.borderColor = 'rgba(245,168,0,0.4)';
        errorMsg.style.color = '#F5A800';
      }
    });
  </script>
</body>
</html>
